<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>🗿 卢巴族皇家座椅 · 艺术闯关测试</title>
    <script>
        (function() {
            if ('scrollRestoration' in history) {
                history.scrollRestoration = 'manual';
            }
            if (window.location.hash) {
                try {
                    window.location.replace(window.location.pathname + window.location.search);
                } catch(e) {}
            }
            var checkScroll = setInterval(function() {
                if (window.scrollY > 5 || document.documentElement.scrollTop > 5 || document.body.scrollTop > 5) {
                    window.scrollTo(0, 0);
                    document.documentElement.scrollTop = 0;
                    document.body.scrollTop = 0;
                }
            }, 5);
            setTimeout(function() { clearInterval(checkScroll); }, 2000);
        })();
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: linear-gradient(145deg, #1a1e2c 0%, #2b2f45 100%);
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', system-ui, sans-serif;
            padding: 18px;
        }
        .test-card {
            max-width: 820px; width: 100%; margin: 0 auto;
            background: rgba(250, 247, 235, 0.95);
            backdrop-filter: blur(4px);
            border-radius: 56px 56px 48px 48px;
            padding: 32px 28px 42px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6), 0 4px 12px rgba(0,0,0,0.3);
            border: 1px solid #b8af94;
        }
        h1 {
            font-size: 2.1rem; font-weight: 700; color: #2d253b;
            display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
            border-bottom: 3px dashed #b8a88a; padding-bottom: 18px; margin-bottom: 22px;
        }
        h1 small { font-size: 1rem; font-weight: 400; color: #4f4460; margin-left: 6px; }
        .question-block {
            background: #fcf9f0; border-radius: 32px; padding: 20px 22px 18px;
            margin-bottom: 22px; box-shadow: 0 6px 14px rgba(0,0,0,0.10);
            border: 1px solid #d6ccb8; transition: 0.2s; position: relative;
        }
        .question-block.correct { border-left: 8px solid #4f9f7a; background: #f2fcf6; }
        .question-block.wrong { border-left: 8px solid #c0695a; background: #fdf4f2; }
        .q-title { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
        .q-num { background: #5b4f6b; color: #f0ede6; font-weight: 600; font-size: 0.9rem; padding: 4px 14px; border-radius: 40px; }
        .q-type { font-size: 0.85rem; background: #d3c9b8; color: #2f2840; padding: 2px 16px; border-radius: 30px; font-weight: 500; }
        .q-text { font-size: 1.2rem; font-weight: 500; color: #1e1a2a; margin: 8px 0 14px 0; line-height: 1.5; }
        .options { display: flex; flex-direction: column; gap: 10px; margin: 6px 0 4px; }
        .opt-label {
            display: flex; align-items: center; gap: 14px;
            background: #f0ebe0; padding: 12px 18px; border-radius: 60px;
            border: 1px solid #d6cbbc; transition: all 0.15s; cursor: pointer;
            font-size: 1.05rem; color: #1f1b2a;
        }
        .opt-label:hover { background: #e5ddd0; border-color: #b3a58e; }
        .opt-label input[type="checkbox"], .opt-label input[type="radio"] {
            width: 20px; height: 20px; accent-color: #6a5d7a; flex-shrink: 0; cursor: pointer;
        }
        .opt-label.correct-option { background: #d0ecdc; border-color: #3a8a62; }
        .opt-label.wrong-option { background: #f8dbd6; border-color: #b85a4a; }
        .opt-label.missed-option { background: #f7e5d4; border-color: #c98f7a; opacity: 0.9; }
        .result-badge { display: inline-block; margin-left: 14px; font-weight: 600; font-size: 0.95rem; }
        .action-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; margin: 28px 0 16px; gap: 14px; }
        .btn {
            background: #ded3c2; border: none; padding: 14px 32px; border-radius: 60px;
            font-weight: 600; font-size: 1.2rem; color: #242033;
            border: 1px solid #b8ad98; box-shadow: 0 4px 0 #9b8f7a;
            transition: 0.08s linear; cursor: pointer; flex: 1 1 auto; min-width: 130px;
        }
        .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #9b8f7a; }
        .btn-primary { background: #7b6d8a; border-color: #5e516b; color: #f5f0e6; box-shadow: 0 4px 0 #473d50; }
        .btn-primary:active { box-shadow: 0 1px 0 #473d50; }
        .btn:disabled { opacity: 0.5; transform: translateY(2px); box-shadow: 0 2px 0 #9b8f7a; pointer-events: none; }
        .score-area {
            background: #2d2640; border-radius: 60px; padding: 16px 24px;
            color: #efeade; display: flex; flex-wrap: wrap; align-items: center;
            justify-content: space-between; gap: 12px 10px; margin-top: 18px;
            border: 1px solid #5b4e6b;
        }
        .score-badge { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
        .score-number {
            font-size: 2.1rem; font-weight: 700; background: #443a54;
            padding: 0 18px; border-radius: 60px; line-height: 1.4; color: #f3ede0;
        }
        .rank-box {
            background: #443a54; padding: 6px 22px; border-radius: 60px;
            font-size: 1.2rem; font-weight: 500; color: #f4ede0; white-space: nowrap;
        }
        .rank-box span { font-weight: 700; color: #fadf9e; }
        .footer-note {
            text-align: center; margin-top: 24px; font-size: 0.95rem;
            color: #61586e; border-top: 1px solid #cdc2b0; padding-top: 20px;
        }
        .reset-area { display: flex; justify-content: flex-end; }
        .btn-reset {
            background: #c7bbac; color: #232033; padding: 8px 22px;
            font-size: 1rem; min-width: 80px; flex: 0 1 auto; box-shadow: 0 3px 0 #9d907e;
        }
        @media (max-width: 520px) {
            .test-card { padding: 22px 16px; }
            h1 { font-size: 1.7rem; }
            .q-text { font-size: 1.05rem; }
            .opt-label { font-size: 0.95rem; padding: 10px 14px; }
            .btn { padding: 12px 16px; font-size: 1rem; }
            .score-number { font-size: 1.8rem; }
        }
    </style>
</head>
<body>
<div class="test-card" id="app">
    <h1>🗿 卢巴族皇家座椅 · 闯关 <small>🎯 布利大师·非洲木雕</small></h1>
    <div id="questionsContainer"></div>
    <div class="action-bar">
        <button class="btn btn-primary" id="submitBtn">✅ 提交答案</button>
        <div class="reset-area">
            <button class="btn btn-reset" id="resetBtn">🔄 重玩</button>
        </div>
    </div>
    <div class="score-area" id="scoreArea">
        <div class="score-badge">
            <span style="font-size:1.2rem;">🏆 得分</span>
            <span class="score-number" id="scoreDisplay">0</span>
            <span style="font-size:1rem;">/ 16</span>
        </div>
        <div class="rank-box" id="rankDisplay"><span>🌟</span> 艺术小种子</div>
    </div>
    <div class="footer-note">⭐ 绿色边框=答对，红色边框=答错 · 错题不显示答案</div>
</div>
<script>
    (function() {
        const QUESTIONS = [
            { id: 1, type: 'single', text: '《卢巴族皇家座椅》创作于哪个时期？', options: ['A. 15世纪', 'B. 17世纪', 'C. 19世纪', 'D. 20世纪'], answer: [2] },
            { id: 2, type: 'single', text: '这件作品来自哪个非洲王国？', options: ['A. 贝宁王国', 'B. 卢巴王国', 'C. 刚果王国', 'D. 阿散蒂王国'], answer: [1] },
            { id: 3, type: 'multi', text: '关于《卢巴族皇家座椅》的创作背景，以下哪些说法正确？', options: ['A. 创作于欧洲殖民前的非洲', 'B. 座椅是卢巴王权最重要的象征物', 'C. 座椅从不用于日常坐，而是存放国王灵魂的圣物', 'D. 座椅是普通家具，人人可用'], answer: [0,1,2] },
            { id: 4, type: 'single', text: '这件作品的作者通常被称为？', options: ['A. 布利大师', 'B. 贝宁大师', 'C. 刚果大师', 'D. 阿散蒂大师'], answer: [0] },
            { id: 5, type: 'multi', text: '关于布利大师（恩贡戈·亚·钦图），以下哪些说法正确？', options: ['A. 他是欧洲殖民前非洲最著名的雕塑家之一', 'B. 他的名字意为“雕刻万物之父”', 'C. 他的风格特征是面部和手部拉长', 'D. 他一生只雕刻男性形象'], answer: [0,1,2] },
            { id: 6, type: 'single', text: '座椅上的人像是什么姿态？', options: ['A. 站立', 'B. 跪姿，用头部和双手撑起座椅', 'C. 坐着', 'D. 躺着'], answer: [1] },
            { id: 7, type: 'multi', text: '《卢巴族皇家座椅》画面中包含了哪些元素？', options: ['A. 跪姿女性人像', 'B. 精致发型', 'C. 金属钉饰', 'D. 繁华的城市背景'], answer: [0,1,2] },
            { id: 8, type: 'single', text: '座椅上的人像是男性还是女性？', options: ['A. 男性', 'B. 女性', 'C. 男女各一', 'D. 没有性别'], answer: [1] },
            { id: 9, type: 'multi', text: '关于《卢巴族皇家座椅》的技法，以下哪些描述正确？', options: ['A. 从一整块木头中雕刻而成', 'B. 面部和手部被刻意拉长', 'C. 表面经过抛光处理', 'D. 使用拼接技术制作'], answer: [0,1,2] },
            { id: 10, type: 'single', text: '在卢巴文化中，座椅的等级代表什么？', options: ['A. 年龄', 'B. 权力的等级', 'C. 财富', 'D. 职业'], answer: [1] },
            { id: 11, type: 'single', text: '卢巴族通过什么方式传承权力和遗产？', options: ['A. 父系', 'B. 母系', 'C. 选举', 'D. 武力'], answer: [1] },
            { id: 12, type: 'single', text: '《卢巴族皇家座椅》现藏于哪个博物馆？', options: ['A. 巴黎卢浮宫', 'B. 纽约大都会艺术博物馆', 'C. 伦敦大英博物馆', 'D. 柏林民族学博物馆'], answer: [1] },
            { id: 13, type: 'multi', text: '观看《卢巴族皇家座椅》时，观众常产生哪些心理感受？', options: ['A. 神圣感', 'B. 力量感', 'C. 宁静感', 'D. 恐惧感'], answer: [0,1,2] },
            { id: 14, type: 'single', text: '《卢巴族皇家座椅》的高度大约是？', options: ['A. 30厘米', 'B. 61厘米', 'C. 100厘米', 'D. 150厘米'], answer: [1] },
            { id: 15, type: 'multi', text: '关于《卢巴族皇家座椅》的历史影响，以下哪些说法正确？', options: ['A. 它是大都会博物馆的珍贵藏品', 'B. 它是非洲木雕艺术的代表作', 'C. 布利大师的风格启发了无数艺术家', 'D. 它在布利大师生前无人知晓'], answer: [0,1,2] },
            { id: 16, type: 'single', text: '《卢巴族皇家座椅》最核心的艺术魅力在于？', options: ['A. 精确的写实技巧', 'B. 用木头承载了权力、祖先和整个宇宙', 'C. 华丽的色彩装饰', 'D. 复杂的宗教叙事'], answer: [1] }
        ];

        const TOTAL = QUESTIONS.length;
        function getRank(score) {
            if (score >= 13) return { emoji: '🏆', label: '卢巴小博士' };
            if (score >= 9) return { emoji: '🌟', label: '非洲艺术小侦探' };
            return { emoji: '🌱', label: '艺术小种子' };
        }

        const container = document.getElementById('questionsContainer');
        const submitBtn = document.getElementById('submitBtn');
        const resetBtn = document.getElementById('resetBtn');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const rankDisplay = document.getElementById('rankDisplay');

        function renderQuestions() {
            let html = '';
            QUESTIONS.forEach((q, idx) => {
                const qId = `q${idx}`;
                const typeLabel = q.type === 'single' ? '⭐ 单选' : '★★ 多选';
                const inputType = q.type === 'single' ? 'radio' : 'checkbox';
                const nameAttr = q.type === 'single' ? `name="${qId}"` : '';
                html += `<div class="question-block" data-qidx="${idx}" id="block-${idx}">`;
                html += `<div class="q-title"><span class="q-num">${idx+1}</span><span class="q-type">${typeLabel}</span>`;
                html += `<span class="result-badge" id="badge-${idx}"></span></div>`;
                html += `<div class="q-text">${q.text}</div>`;
                html += `<div class="options" id="options-${idx}">`;
                q.options.forEach((optText, optIdx) => {
                    const val = String(optIdx);
                    html += `<label class="opt-label" id="optlabel-${idx}-${optIdx}">`;
                    html += `<input type="${inputType}" ${nameAttr} value="${val}" data-q="${idx}" data-opt="${optIdx}">`;
                    html += `<span>${optText}</span></label>`;
                });
                html += `</div></div>`;
            });
            container.innerHTML = html;
        }

        function getUserSelections() {
            const allInputs = container.querySelectorAll('input[type="radio"], input[type="checkbox"]');
            const selections = {};
            allInputs.forEach(input => {
                const qIdx = parseInt(input.dataset.q, 10);
                if (!selections[qIdx]) selections[qIdx] = [];
                if (input.checked) selections[qIdx].push(parseInt(input.dataset.opt, 10));
            });
            return selections;
        }

        function getDetailedResult(selections) {
            const result = { score: 0, details: [] };
            for (let i = 0; i < QUESTIONS.length; i++) {
                const q = QUESTIONS[i];
                const userAns = selections[i] || [];
                const correctAns = q.answer.slice().sort();
                const sortedUser = userAns.slice().sort();
                const isCorrect = JSON.stringify(sortedUser) === JSON.stringify(correctAns);
                if (isCorrect) result.score++;
                result.details.push({ correct: isCorrect, userAns: userAns.slice(), correctAns: correctAns });
            }
            return result;
        }

        function applyResultDetails(details) {
            for (let i = 0; i < details.length; i++) {
                const block = document.getElementById(`block-${i}`);
                const badge = document.getElementById(`badge-${i}`);
                const detail = details[i];
                block.classList.remove('correct', 'wrong');
                if (detail.correct) {
                    block.classList.add('correct');
                    badge.innerHTML = '✅ <span style="color:#1f7a4a;">答对啦</span>';
                } else {
                    block.classList.add('wrong');
                    badge.innerHTML = '❌ <span style="color:#b14535;">再想想</span>';
                }
                const q = QUESTIONS[i];
                const userAns = detail.userAns;
                const correctAns = detail.correctAns;
                for (let optIdx = 0; optIdx < q.options.length; optIdx++) {
                    const label = document.getElementById(`optlabel-${i}-${optIdx}`);
                    if (!label) continue;
                    label.classList.remove('correct-option', 'wrong-option', 'missed-option');
                    const isUserSelected = userAns.includes(optIdx);
                    if (isUserSelected) {
                        if (correctAns.includes(optIdx)) label.classList.add('correct-option');
                        else label.classList.add('wrong-option');
                    } else {
                        if (correctAns.includes(optIdx)) label.classList.add('missed-option');
                    }
                }
            }
        }

        function updateScore(score) {
            scoreDisplay.textContent = score;
            const rank = getRank(score);
            rankDisplay.innerHTML = `<span>${rank.emoji}</span> ${rank.label}`;
        }

        function disableAllInputs(disabled = true) {
            const inputs = container.querySelectorAll('input');
            inputs.forEach(inp => inp.disabled = disabled);
        }

        function handleSubmit() {
            const selections = getUserSelections();
            let allAnswered = true;
            for (let i = 0; i < QUESTIONS.length; i++) {
                if (!selections[i] || selections[i].length === 0) { allAnswered = false; break; }
            }
            if (!allAnswered) { alert('🧐 还有题目没有作答呢！'); return; }
            const result = getDetailedResult(selections);
            updateScore(result.score);
            applyResultDetails(result.details);
            disableAllInputs(true);
            submitBtn.disabled = true;
            document.getElementById('scoreArea').scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function handleReset() {
            const inputs = container.querySelectorAll('input');
            inputs.forEach(inp => { inp.checked = false; inp.disabled = false; });
            const blocks = container.querySelectorAll('.question-block');
            blocks.forEach(block => block.classList.remove('correct', 'wrong'));
            const badges = container.querySelectorAll('.result-badge');
            badges.forEach(b => b.innerHTML = '');
            const optLabels = container.querySelectorAll('.opt-label');
            optLabels.forEach(label => label.classList.remove('correct-option', 'wrong-option', 'missed-option'));
            submitBtn.disabled = false;
            updateScore(0);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function init() {
            renderQuestions();
            updateScore(0);
            submitBtn.addEventListener('click', handleSubmit);
            resetBtn.addEventListener('click', handleReset);
        }
        init();
    })();
</script>
</body>
</html>
